<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골목상회 공동구매</title>
<meta name="description" content="함께 모이면 더 싸지는 방앗간 공동구매">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ef; --card:#ffffff; --ink:#2a2118; --sub:#76685a; --line:#eadfce;
  --accent:#b5541c; --accent-ink:#ffffff; --accent-soft:#f6e3d3;
  --ok:#3f7d4e; --ok-soft:#e3f0e5; --muted:#c9bcab; --danger:#b3261e;
  --radius:16px; --shadow:0 2px 10px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.brand small{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--accent);margin-left:6px}
.hdr-r{display:flex;align-items:center;gap:12px}
.contact{font-size:13px;color:var(--sub);text-decoration:none}
.myorders{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.myorders[hidden]{display:none}

.hero{padding:40px 0 16px}
.hero h1{font-family:'Noto Serif KR',serif;font-size:clamp(26px,5vw,38px);line-height:1.3;margin:0 0 10px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--sub);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:24px 0 8px;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub);counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin-right:8px}
.steps b{color:var(--ink)}

.notice{margin:16px 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px;color:var(--ink)}
.notice:empty{display:none}

#list{padding-bottom:40px}
.sec{margin:28px 0 0}
.sec:first-child{margin-top:12px}
.sec h2{font-family:'Noto Serif KR',serif;font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.sec .lead{margin:0 0 4px;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:12px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.closed{opacity:.62}
.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#efe2cf,#e2cdb0);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-size:44px;color:rgba(90,60,30,.35)}
.tag{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ink);color:#fff}
.tag.hot{background:var(--accent)}
.tag.done{background:var(--ok)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:18px;letter-spacing:-.02em}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--sub);align-self:flex-start}
.desc{margin:0;color:var(--sub);font-size:14px;white-space:pre-line}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .off{color:var(--accent);font-weight:700;font-size:18px}
.price .now{font-weight:700;font-size:22px}
.price .was{color:var(--muted);text-decoration:line-through;font-size:14px}
.meter{height:10px;border-radius:999px;background:#f1e8db;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s ease}
.meter.ok i{background:var(--ok)}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.stats b{color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);flex:1}
.btn:disabled{background:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);flex:0 0 auto;font-weight:500}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:48px 0}
.skeleton{height:420px;border-radius:var(--radius);background:linear-gradient(90deg,#f1e8db 25%,#f7f1e8 50%,#f1e8db 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

dialog{border:0;border-radius:20px;padding:0;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(30,20,10,.45)}
.dlg{padding:22px 20px 20px;overflow:auto}
.dlg h2{margin:0 0 4px;font-size:20px}
.dlg .subt{margin:0 0 18px;color:var(--sub);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pick{font-size:13px;color:var(--sub);margin:6px 0 0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.qty span{min-width:22px;text-align:center}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);margin:4px 0 16px}
.consent input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
.consent details{margin-top:4px}
.total{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line);margin-bottom:14px}
.total .ln{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:22px}
.hp{position:absolute;left:-9999px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-6px 0 10px}
.row{display:flex;gap:8px}
.done-box{text-align:center;padding:8px 0}
.done-box .no{font-family:ui-monospace,monospace;background:var(--bg);padding:6px 10px;border-radius:8px;display:inline-block;margin:6px 0 14px}
.bank{background:var(--accent-soft);border-radius:12px;padding:14px;text-align:left;font-size:14px;margin-bottom:16px}
.bank b{display:block;font-size:16px;margin-top:2px}
.bank.card{background:var(--ok-soft)}
.bank .btn{display:block;width:100%;margin-top:10px;padding:11px 14px;font-size:14px}

.cart-list{border-top:1px solid var(--line);margin:4px 0 18px}
.ci{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci-name{font-size:15px;font-weight:500;min-width:0}
.ci-name small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.ci-sum{font-size:14px;min-width:64px;text-align:right}
.ci-x{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(60,40,20,.08);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.cartbar[hidden]{display:none}
.cartbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar .btn{flex:0 0 auto;padding:12px 22px}

.pickcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:14px;margin:0 0 14px}
.pickcard b{display:block;font-size:15px;margin-bottom:2px}
.pickcard .ln{color:var(--sub);font-size:13px}
.pickcard .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pickcard .acts a,.pickcard .acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
.olist .oitem{border-bottom:1px solid var(--line);padding:14px 0}
.olist .oitem:first-child{padding-top:0}

footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--sub);font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .contact{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="./" id="brand">골목상회<small>공동구매</small></a>
    <span class="hdr-r"><button class="myorders" id="myOrders" hidden>내 주문</button><a class="contact" id="contact" href="#"></a></span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>함께 모이면,<br>방앗간 기름이 더 싸집니다</h1>
    <p>목표 수량이 모이면 공동구매가 확정되고, 마감 후 한 번에 짜서 보내드립니다.</p>
    <ol class="steps">
      <li><b>참여 신청</b> — 수량과 연락처만 남기면 끝</li>
      <li id="stepPay"><b>입금</b> — 주문 후 안내된 계좌로 입금하면 참여 완료 (목표 미달 시 전액 환불)</li>
      <li><b>계좌번호</b> <span id="stepBank"></span></li>
      <li id="stepRecv"><b>마감 후 수령</b> — 매장 픽업 또는 배송으로</li>
    </ol>
  </section>
  <div class="notice" id="notice"></div>
  <div id="list">
    <div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<div class="cartbar" id="cartBar" hidden><div class="wrap"><span id="cartInfo"></span><button class="btn" id="cartOpen">주문하기</button></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정 — 이 부분만 고치면 됩니다
   ========================================================= */
const CONFIG = {
  BRAND: '골목상회',
  CONTACT: '010-8173-1070',                              // 문의 전화번호
  BANK: '새마을금고 9003-3026-2527-6 (예금주: 신용주)',    // 입금 계좌
  DEPOSIT_HOURS: 24,                                      // 입금 기한(시간)

  // 카드결제 (페이앱). 두 칸을 모두 채우면 장바구니에 '카드결제'가 나타납니다.
  PAYAPP_USERID: '',        // 페이앱 판매자 아이디
  PAYAPP_FEEDBACK_URL: '',  // 결제 결과를 받을 Apps Script 웹 앱 주소 (https://script.google.com/macros/s/.../exec)

  // 픽업 매장 정보
  STORE_NAME: '골목상회',
  ADDRESS: '경남 창원시 의창구 북면 무동로226번길 6-25 중앙프라자 101호',
  HOURS: '',                                              // 영업시간 (예: '09:00~19:00, 일요일 휴무')

  // 배송
  ALLOW_DELIVERY: true,      // false = 모든 상품 매장 픽업만
  DELIVERY_LABEL: '일반배송', // 배송 방식 이름 (매장에서 직접 배송)
  DELIVERY_FEE: 2000,        // 배송비
  FREE_SHIP_OVER: 30000,     // 이 금액 이상 주문 시 무료배송 (0 = 항상 배송비)
  DELIVERY_NOTE: '',         // 배송 안내 (예: '창원 시내만 배송 가능해요')

  // SheetDB API 주소. 비워두면 '데모 모드'로 샘플 상품이 보입니다.
  PRODUCTS_API: 'https://sheetdb.io/api/v1/oehravh1238d4',  // 상품 시트 (권한: Read만)
  ORDERS_API:   'https://sheetdb.io/api/v1/6stebbx7m1x8h',  // 주문 시트 (권한: Create만)

  // 방문자 통계. ID를 넣으면 자동으로 켜지고, 비워두면 꺼집니다.
  GA4_ID: 'G-6V2WT3023C',        // 구글 애널리틱스 측정 ID (예: 'G-ABC123XYZ')
  NAVER_WA_ID: '1c7defdabb016c0',   // 네이버 애널리틱스 사이트 ID (예: '1a2b3c4d5e6f7')

  CACHE_MINUTES: 5,  // 같은 방문자가 이 시간 안에 다시 오면 시트를 다시 읽지 않음 (요청 수 절약)
  PRIVACY_DAYS: 90,  // 개인정보 보유 기간(일)
};

/* ---------- 방문자 통계 (GA4 + 네이버 애널리틱스) ----------
   이름·전화번호·주소 같은 개인정보는 보내지 않고, 상품·금액·주문번호만 보냅니다. */
const STATS = (() => {
  const load = src => { const s = document.createElement('script'); s.async = true; s.src = src; document.head.appendChild(s); return s; };
  if (CONFIG.GA4_ID) {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', CONFIG.GA4_ID);
    load('https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(CONFIG.GA4_ID));
  }
  if (CONFIG.NAVER_WA_ID) {
    window.wcs_add = window.wcs_add || {};
    wcs_add['wa'] = CONFIG.NAVER_WA_ID;
    load('https://wcs.naver.net/wcslog.js').onload = () => { try { window.wcs && wcs_do(); } catch(e){} };
  }
  const item = (p, qty = 1) => ({item_id: p.id, item_name: p.name, item_category: p.regular ? '일반' : '공동구매', price: unitOf(p), quantity: qty});
  const ga = (name, params) => { try { window.gtag && CONFIG.GA4_ID && gtag('event', name, params); } catch(e){} };
  const naverConv = (type, value) => { try { if (window.wcs && CONFIG.NAVER_WA_ID) wcs.trans({type, value: value != null ? String(value) : undefined}); } catch(e){} };
  return {
    addToCart(p){ ga('add_to_cart', {currency: 'KRW', value: unitOf(p), items: [item(p)]}); naverConv('add_to_cart'); },
    beginCheckout(items){ ga('begin_checkout', {currency: 'KRW', value: items.reduce((a, x) => a + unitOf(x.p) * x.qty, 0), items: items.map(x => item(x.p, x.qty))}); },
    purchase(no, items, total, fee, pay, recv){
      ga('purchase', {transaction_id: no, currency: 'KRW', value: total, shipping: fee, payment_type: pay, shipping_tier: recv, items: items.map(x => item(x.p, x.qty))});
      naverConv('purchase', total);
    },
    share(p){ ga('share', {method: navigator.share ? 'native' : 'link', content_type: 'product', item_id: p.id}); },
  };
})();

/* ---------- 데모 데이터 (API 주소가 비어 있을 때만 사용) ---------- */
const DEMO = (() => {
  const d = n => new Date(Date.now() + n * 864e5).toISOString().slice(0,10);
  return [
    {id:'P01', name:'저온압착 참기름 350ml', desc:'국산 참깨를 낮은 온도로 볶아 짠 참기름.\n주문 마감 후 착유해 드립니다.', price:'28000', group_price:'22000', target_qty:'30', max_qty:'60', joined_qty:'21', deadline:d(4), status:'진행', type:'공구', badge:'국산 참깨 100%'},
    {id:'P02', name:'생들기름 350ml', desc:'볶지 않고 짠 생들기름. 냉장 보관 필수.', price:'26000', group_price:'20500', target_qty:'20', max_qty:'40', joined_qty:'24', deadline:d(2), status:'진행', type:'공구', delivery:'불가'},
    {id:'R01', name:'참기름 180ml', desc:'매장에서 매일 짜는 기본 참기름.', price:'15000', max_qty:'40', joined_qty:'12', status:'진행', type:'일반'},
    {id:'R02', name:'볶음 들깨가루 300g', desc:'국산 들깨를 볶아 곱게 빻았습니다.', price:'12000', status:'진행', type:'일반'},
  ];
})();
const DEMO_MODE = !CONFIG.PRODUCTS_API;
const PICKUP = '매장 픽업';
const SHIP = CONFIG.DELIVERY_LABEL || '일반배송';
const BANKPAY = '계좌이체', CARDPAY = '카드결제';
const CARD_ON = !!(CONFIG.PAYAPP_USERID && CONFIG.PAYAPP_FEEDBACK_URL);
const STORE = {name: CONFIG.STORE_NAME || CONFIG.BRAND, address: CONFIG.ADDRESS, hours: CONFIG.HOURS, phone: CONFIG.CONTACT};
// 배송비: 상품 금액이 무료배송 기준 이상이면 0원
const shipFee = items => (CONFIG.FREE_SHIP_OVER && items >= CONFIG.FREE_SHIP_OVER) ? 0 : (CONFIG.DELIVERY_FEE || 0);

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseInt(String(v ?? '').replace(/[^\d-]/g,''), 10); return isNaN(n) ? 0 : n; };
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function parseDeadline(str) {
  const m = String(str).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return null;
  // 마감일 당일 23:59:59(한국시간)까지 유효
  return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59);
}
function remain(dl){
  if (!dl) return '';
  const ms = dl - Date.now(); if (ms <= 0) return '마감';
  const h = ms / 36e5;
  return h < 24 ? `${Math.ceil(h)}시간 남음` : `D-${Math.ceil(h/24)}`;
}
function nowKST(){
  const t = new Date(Date.now() + 9*36e5);
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())} ${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:${pad(t.getUTCSeconds())}`;
}
function orderNo(){
  const t = new Date(Date.now() + 9*36e5);
  const n = 1000 + Math.floor(Math.random() * 9000);   // 1000~9999
  return `${pad(t.getUTCMonth()+1)}${pad(t.getUTCDate())}-${n}`;
}
function fmtPhone(v){
  const d = v.replace(/\D/g,'');
  if (d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  return v.trim();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
// 브라우저 저장소 (막혀 있어도 사이트는 동작)
const ls = {
  get(k, def){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch(e) { return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
};
const ss = {
  get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch(e) { return null; } },
  set(k, v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
};

/* ---------- 이미지 ---------- */
// https 주소 또는 저장소 안 경로. 한글·띄어쓰기 파일명도 허용
const safeImg = u => {
  u = String(u||'').trim().replace(/^\/+/, '');
  if (!u || /["'<>\\]|^javascript:/i.test(u)) return '';
  if (/^https?:\/\//i.test(u)) return u;
  return /\.(jpe?g|png|webp|gif)$/i.test(u) ? u : '';
};
const imgSrc = u => /^https?:/i.test(u) ? u : encodeURI(u);
// 경로가 틀렸을 때 image/, images/ 폴더도 차례로 시도하고, 그래도 없으면 기본 그림
function imgFallback(el){
  const tried = (el.dataset.tried || '').split('|');
  const name = el.dataset.src.split('/').pop();
  const next = ['image/' + name, 'images/' + name].find(c => c !== el.dataset.src && !tried.includes(c));
  if (next && !/^https?:/i.test(el.dataset.src)) { el.dataset.tried = tried.concat(next).join('|'); el.src = encodeURI(next); return; }
  console.warn('이미지를 찾을 수 없음:', el.dataset.src);
  el.outerHTML = `<div class="ph">${esc(el.alt.slice(0,1))}</div>`;
}

// 시트 헤더 정리: 앞뒤 공백·대소문자 무시, 한글 헤더도 인식
const HEADER_ALIAS = {'구분':'type','유형':'type','판매유형':'type','정가':'price','공구가':'group_price','공동구매가':'group_price',
  '상품명':'name','설명':'desc','이미지':'image','목표수량':'target_qty','최대수량':'max_qty','재고':'max_qty','마감일':'deadline',
  '상태':'status','배지':'badge','문구':'badge','태그':'badge','택배':'delivery','배송':'delivery'};
const cleanRows = rows => (Array.isArray(rows) ? rows : []).map(r => {
  const o = {};
  for (const [k, v] of Object.entries(r || {})) { const key = String(k).trim().toLowerCase(); o[HEADER_ALIAS[key] || key] = typeof v === 'string' ? v.trim() : v; }
  return o;
});
async function loadProducts(){
  if (DEMO_MODE) return DEMO;
  const c = ss.get('gb_products');
  if (c && c.v === 3 && Date.now() - c.at < CONFIG.CACHE_MINUTES * 6e4) return c.rows;
  const res = await fetch(CONFIG.PRODUCTS_API);
  if (res.status === 429) throw new Error('이번 달 조회 한도를 넘었어요. 전화로 문의해 주세요: ' + CONFIG.CONTACT);
  if (!res.ok) throw new Error('상품을 불러오지 못했어요 (' + res.status + ')');
  const rows = cleanRows(await res.json());
  ss.set('gb_products', {v: 3, at: Date.now(), rows});
  return rows;
}
async function postOrder(rows){
  if (DEMO_MODE || !CONFIG.ORDERS_API) return new Promise(r => setTimeout(r, 600));
  const res = await fetch(CONFIG.ORDERS_API, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify({data: rows})});
  if (res.status === 429) throw new Error('지금 주문이 몰려 접수가 어려워요. 전화로 주문해 주세요: ' + CONFIG.CONTACT);
  if (!res.ok) {
    let detail = ''; try { const j = await res.json(); detail = j.error || j.message || ''; } catch(_) {}
    console.error('주문 API 오류', res.status, detail);
    throw new Error('접수에 실패했어요 (' + res.status + (detail ? ': ' + detail : '') + '). 전화로 주문해 주세요: ' + CONFIG.CONTACT);
  }
}

// 페이앱 결제창으로 이동. 결제 결과는 페이앱 → Apps Script(feedbackurl)로 전달되어 주문 시트에 기록됨.
// 돌아오는 화면(returnurl)은 안내용일 뿐, 결제 확인은 시트의 '결제완료'로 판단합니다.
function payCard(o){
  const back = location.origin + location.pathname + '?paid=' + encodeURIComponent(o.order_no);
  const fields = {
    userid: CONFIG.PAYAPP_USERID, shopname: CONFIG.BRAND,
    goodname: o.goodname, price: o.total, recvphone: String(o.phone).replace(/\D/g, ''),
    memo: '주문번호 ' + o.order_no, var1: o.order_no,
    feedbackurl: CONFIG.PAYAPP_FEEDBACK_URL, checkretry: 'y',
    returnurl: back, smsuse: 'n',
  };
  const form = document.createElement('form');
  form.method = 'post'; form.action = 'https://lite.payapp.kr/pay'; form.acceptCharset = 'utf-8'; form.style.display = 'none';
  for (const [k, v] of Object.entries(fields)) { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; form.appendChild(i); }
  document.body.appendChild(form);
  form.submit();
}

/* ---------- 상품 ---------- */
let PRODUCTS = [];
function normalize(r){
  const dl = parseDeadline(r.deadline);
  const type = String(r.type || '');
  const p = {
    id: String(r.id||'').trim(), name: r.name||'', desc: r.desc||'', image: safeImg(r.image),
    price: num(r.price), gp: num(r.group_price), target: num(r.target_qty), max: num(r.max_qty),
    joined: num(r.joined_qty), deadline: dl, status: String(r.status||'진행').trim(), raw: r,
    badge: /^(-|없음)?$/.test(String(r.badge ?? '').trim()) ? '' : String(r.badge).trim(),
    // type: 일반·상시·매장 = 매장 상품 / 그 외(빈칸 포함) = 공동구매
    regular: /일반|상시|매장/.test(type) && !/공구|공동/.test(type),
    // delivery: 불가·X·N·픽업 = 배송 불가
    ship: CONFIG.ALLOW_DELIVERY && !/^(불가|x|n|no|픽업|픽업만|매장픽업)$/i.test(String(r.delivery ?? '').trim()),
  };
  p.left = p.max ? Math.max(0, p.max - p.joined) : Infinity;
  p.closed = p.status === '마감' || (dl && dl <= Date.now()) || p.left <= 0;
  p.reached = p.target > 0 && p.joined >= p.target;
  return p;
}
const findP = id => PRODUCTS.find(p => p.id === id);
const unitOf = p => p.gp || p.price;
const maxOf = p => p.left === Infinity ? 99 : p.left;

function card(p){
  const off = p.price > p.gp && p.gp ? Math.round((1 - p.gp/p.price)*100) : 0;
  const pct = p.target ? Math.min(100, Math.round(p.joined / p.target * 100)) : 0;
  const tag = p.regular
      ? (p.closed ? `<span class="tag">${p.left <= 0 ? '품절' : '판매 종료'}</span>` : '')
    : p.closed ? `<span class="tag">마감</span>`
    : p.reached ? `<span class="tag done">공구 확정</span>`
    : pct >= 70 ? `<span class="tag hot">마감 임박</span>` : '';
  // 공구 진행 문구: 목표까지 몇 개 남았는지 보여주고, 수량 한정은 얼마 안 남았을 때만 표시
  const need = p.target - p.joined;
  const goalTxt = !p.target ? `<b>${p.joined}개</b> 참여 중`
    : p.reached ? `목표 ${p.target}개 달성! <b>${p.joined}개</b> 참여`
    : `목표 ${p.target}개 중 <b>${p.joined}개</b> 모였어요`;
  const needTxt = p.closed || !p.target ? ''
    : p.reached ? '공동구매가 확정됐어요. 마감 전까지 더 참여할 수 있어요.'
    : `<b>${need}개</b> 더 모이면 공동구매 확정!`;
  const leftTxt = !p.closed && p.left !== Infinity && p.left <= 10 ? ` · 한정 <b>${p.left}개</b> 남음` : '';
  const meta = p.regular
    ? (p.max && !p.closed ? `<div class="stats"><span>재고 <b>${p.left}개</b></span><span></span></div>` : '')
    : `${p.target ? `<div class="meter${p.reached?' ok':''}"><i style="width:${pct}%"></i></div>` : ''}
      <div class="stats"><span>${goalTxt}</span><span>${p.closed?'마감':esc(remain(p.deadline))}</span></div>
      ${needTxt || leftTxt ? `<div class="stats"><span>${needTxt}${leftTxt}</span><span></span></div>` : ''}`;
  const btn = p.closed
    ? `<button class="btn" disabled>${p.regular ? (p.left <= 0 ? '품절되었습니다' : '판매가 종료되었습니다') : '마감되었습니다'}</button>`
    : `<button class="btn" data-add="${esc(p.id)}">${p.regular ? '장바구니 담기' : '공동구매 담기'}</button>`;
  return `<article class="card${p.closed?' closed':''}" id="p-${esc(p.id)}">
    <div class="thumb">${p.image
      ? `<img src="${esc(imgSrc(p.image))}" data-src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="imgFallback(this)">`
      : `<div class="ph">${esc(p.name.slice(0,1))}</div>`}${tag}</div>
    <div class="body">
      ${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ''}
      <h3>${esc(p.name)}</h3>
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
      <div class="price">${off?`<span class="off">${off}%</span>`:''}<span class="now">${won(unitOf(p))}</span>${off?`<span class="was">${won(p.price)}</span>`:''}</div>
      ${meta}
      <div class="actions">${btn}<button class="btn ghost" data-share="${esc(p.id)}" aria-label="공유">공유</button></div>
    </div>
  </article>`;
}

function render(){
  const list = PRODUCTS.filter(p => p.id && p.status !== '숨김')
    .sort((a,b) => (a.closed - b.closed) || ((a.deadline||Infinity) - (b.deadline||Infinity)));
  const group = list.filter(p => !p.regular), regular = list.filter(p => p.regular);
  const section = (title, lead, items, empty) => `<section class="sec">
      <h2>${title}</h2><p class="lead">${lead}</p>
      <div class="grid">${items.length ? items.map(card).join('') : `<p class="empty">${empty}</p>`}</div>
    </section>`;
  $('#list').innerHTML =
    section('진행 중인 공동구매', '목표 수량이 모이면 확정되는 기간 한정 특가입니다.', group, '지금 진행 중인 공동구매가 없어요. 곧 새 상품으로 찾아올게요.') +
    (regular.length ? section(`${esc(CONFIG.BRAND)} 매장 상품`, CONFIG.ALLOW_DELIVERY ? '언제든 주문하고 배송이나 매장 픽업으로 받으세요.' : '언제든 주문하고 매장에서 픽업하세요.', regular, '') : '');
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView({behavior:'smooth', block:'center'});
}

// 담은 상품은 이 브라우저에만 저장. [{id, qty}]
let CART = ls.get('gb_cart', []);
const saveCart = () => ls.set('gb_cart', CART);
// 마감·품절·숨김·삭제된 상품은 빼고, 수량은 남은 수량 이내로
function cleanCart(){
  const before = CART.length;
  CART = CART.filter(c => { const p = findP(c.id); return p && !p.closed && p.status !== '숨김'; })
             .map(c => ({id: c.id, qty: Math.max(1, Math.min(maxOf(findP(c.id)), num(c.qty) || 1))}));
  saveCart();
  return before - CART.length;
}
const cartItems = () => CART.map(c => ({p: findP(c.id), qty: c.qty})).filter(x => x.p);
const cartCount = () => CART.reduce((a, c) => a + c.qty, 0);
const cartSum = () => cartItems().reduce((a, x) => a + unitOf(x.p) * x.qty, 0);

function addToCart(p){
  if (!p || p.closed) return;
  const c = CART.find(x => x.id === p.id);
  if (c) { if (c.qty >= maxOf(p)) return toast(`남은 수량은 ${p.left}개예요`); c.qty++; }
  else CART.push({id: p.id, qty: 1});
  saveCart(); updateCartBar(); toast('장바구니에 담았어요'); STATS.addToCart(p);
}
function updateCartBar(){
  const n = cartCount();

  if (n) $('#cartInfo').innerHTML = `장바구니 <b>${n}개</b> · ${won(cartSum())}`;
}

    const q = e.target.closest('[data-cq]'), x = e.target.closest('[data-cx]');
    if (q) {
      const c = CART.find(c => c.id === q.dataset.cq), p = findP(q.dataset.cq), n = c.qty + +q.dataset.d;
      if (n > maxOf(p)) toast(`남은 수량은 ${p.left}개예요`);
      c.qty = Math.max(1, Math.min(maxOf(p), n));
    }
    if (x) CART = CART.filter(c => c.id !== x.dataset.cx);
    saveCart();
    if (!CART.length) { updateCartBar(); $('#dlg').close(); return toast('장바구니를 비웠어요'); }
    if (x) return openCart();   // 상품이 빠지면 배송 가능 여부가 달라질 수 있어 다시 그림
    upd();
  };
  const toggle = () => { $('#pickF').style.display = recvVal() === PICKUP ? '' : 'none'; $('#addrF').style.display = recvVal() === SHIP ? '' : 'none'; upd(); };
  f.querySelectorAll('[name=receive]').forEach(r => r.onchange = toggle);
  f.querySelectorAll('[name=pay]').forEach(r => r.onchange = upd);
  toggle();
  $('#cancel').onclick = () => $('#dlg').close();
  f.onsubmit = e => { e.preventDefault(); submitCart(f, canShip); };
  if (!$('#dlg').open) $('#dlg').showModal();
}

async function submitCart(f, canShip){
  const err = $('#err'); err.textContent = '';
  if (f.website.value) return;  // 스팸봇 차단
  const items = cartItems();
  const name = f.name.value.trim(), phone = fmtPhone(f.phone.value), addr = f.address.value.trim();
  const recv = f.querySelector('[name=receive]:checked')?.value || PICKUP;
  const pay = CARD_ON ? (f.querySelector('[name=pay]:checked')?.value || BANKPAY) : BANKPAY;
  if (!items.length) return err.textContent = '장바구니가 비어 있어요.';
  if (!name) return err.textContent = '이름을 입력해 주세요.';
  if (!/^01\d-\d{3,4}-\d{4}$/.test(phone)) return err.textContent = '휴대폰 번호를 확인해 주세요.';
  if (recv === SHIP && !canShip) return err.textContent = '매장 픽업만 가능한 상품이 있어요.';
  if (recv === SHIP && addr.length < 6) return err.textContent = '배송 주소를 입력해 주세요.';
  if (!f.agree.checked) return err.textContent = '개인정보 수집·이용에 동의해 주세요.';
  const over = items.find(x => x.qty > x.p.left);
  if (over) return err.textContent = `${over.p.name}: 남은 수량은 ${over.p.left}개입니다.`;

  const sum = cartSum(), fee = recv === SHIP ? shipFee(sum) : 0;
  const no = orderNo(), at = nowKST();
  // 상품마다 한 줄씩, 같은 주문번호. 배송비·주문 합계는 첫 줄에만 기록
  const rows = items.map(({p, qty}, i) => ({
    order_no: no, created_at: at, product_id: p.id, product_name: p.name,
    unit_price: unitOf(p), qty, total: unitOf(p) * qty,
    ship_fee: i === 0 ? fee : '', order_total: i === 0 ? sum + fee : '',
    name, phone, receive: recv, address: recv === SHIP ? addr : '',
    memo: i === 0 ? f.memo.value.trim() : '', pay_method: pay,
    status: pay === CARDPAY ? '결제대기' : '입금대기',
  }));
  const btn = $('#submit'); btn.disabled = true; btn.textContent = '보내는 중…';
  try {
    await postOrder(rows);
    STATS.purchase(no, items, sum + fee, fee, pay, recv);
    // 화면의 참여 수량을 바로 올려 보여줌 (시트 반영은 몇 분 걸릴 수 있음)
    const c = ss.get('gb_products');
    items.forEach(({p, qty}) => {
      Object.assign(p, normalize({...p.raw, joined_qty: p.joined + qty}));
      const r = c?.rows.find(x => String(x.id).trim() === p.id); if (r) r.joined_qty = p.joined;
    });
    if (c) ss.set('gb_products', c);
    CART = []; saveCart(); updateCartBar(); render();
    const goodname = items[0].p.name + (items.length > 1 ? ` 외 ${items.length - 1}건` : '');
    const v = showDone({order_no: no, name, phone, receive: recv, total: sum + fee, ship_fee: fee, pay, goodname}, items);
    if (pay === CARDPAY && !DEMO_MODE) { btn.textContent = '결제 화면으로 이동 중…'; payCard(v); }
  } catch (e) {
    err.textContent = e.message; btn.disabled = false; btn.textContent = pay === CARDPAY ? '주문하고 카드 결제' : '주문하기';
  }
}

/* ---------- 주문 완료 · 내 주문 ---------- */
// 손님 브라우저에 최근 주문 5건 저장 → 상단 '내 주문'에서 다시 확인
const getOrders = () => ls.get('gb_orders', []);
function saveOrder(v){ ls.set('gb_orders', [v, ...getOrders()].slice(0, 5)); updateMyOrders(); }
function updateMyOrders(){ $('#myOrders').hidden = !getOrders().length; }
function orderBody(v){
  const card = v.pay === CARDPAY;
  const payBox = card
    ? `<div class="bank card">카드결제 ${won(v.total || 0)}<b>${v.card_back ? '결제 화면을 마쳤어요' : '카드 결제가 필요해요'}</b>
        <span style="color:var(--sub);font-size:13px">${v.card_back ? '결제가 확인되면 준비를 시작해요. 결제를 끝내지 못했다면 아래 버튼으로 다시 결제해 주세요.' : '결제를 마쳐야 주문이 확정돼요.'}</span>
        ${CARD_ON ? `<button type="button" class="btn" data-paycard="${esc(v.order_no)}">카드로 결제하기</button>` : ''}</div>`
    : `<div class="bank">아래 계좌로 입금해 주세요.<b>${esc(CONFIG.BANK)}</b><span style="color:var(--sub);font-size:13px">입금자명을 주문자 이름(${esc(v.name)})과 같게 해주시면 빠르게 확인됩니다.</span></div>
       ${v.pickup ? '<p class="subt">현장결제는 픽업 시 결제해 주시면 됩니다.</p>' : ''}`;
  return `<p class="subt" style="margin:0 0 10px">${esc(v.items)}</p>
    ${v.pickup ? pickCard() : `<p class="subt">${esc(v.when)} 직접 배송해 드려요${v.ship_fee ? ` (배송비 ${won(v.ship_fee)} 포함)` : ' (무료배송)'}.</p>`}
    ${payBox}
    ${v.pickup ? `<p class="subt">${esc(v.when)} 상품이 준비되면 문자로 알려드려요.</p>` : ''}`;
}
function showDone(o, items){
  const paid = o.pay === CARDPAY ? '결제 확인 후' : '입금 확인 후';
  const when = items.every(x => x.p.regular) ? paid : items.some(x => x.p.regular) ? `일반 상품은 ${paid}, 공동구매 상품은 마감 후` : '마감 후';
  const v = {
    order_no: o.order_no, at: nowKST().slice(0, 16), name: o.name, total: o.total, ship_fee: o.ship_fee, when,
    items: items.map(x => `${x.p.name} ${x.qty}개`).join(' · '), pickup: o.receive === PICKUP,
    pay: o.pay || BANKPAY, phone: o.phone, goodname: o.goodname,
  };
  saveOrder(v);
  if (v.pay === CARDPAY && !DEMO_MODE) return v;   // 곧바로 결제 화면으로 이동하므로 완료 화면은 돌아온 뒤에 보여줌
  $('#dlgBody').innerHTML = `<div class="done-box">
    <h2>주문이 접수됐어요</h2>
    <p class="subt">주문번호</p><span class="no">${esc(o.order_no)}</span>
    <div style="text-align:left">${orderBody(v)}</div>
    ${DEMO_MODE ? '<p class="subt">※ 데모 모드라 실제 주문은 저장되지 않았습니다.</p>' : ''}
    <p class="subt" style="font-size:13px">주문 내용은 화면 위 <b>내 주문</b>에서 다시 볼 수 있어요.</p>
    <div class="row"><button class="btn ghost" id="copyBank">계좌 복사</button><button class="btn" id="ok">확인</button></div></div>`;
  $('#ok').onclick = () => $('#dlg').close();
  $('#copyBank').onclick = async () => { try { await navigator.clipboard.writeText(CONFIG.BANK); toast('계좌번호를 복사했어요'); } catch(e) { toast(CONFIG.BANK); } };
  if (v.pay === CARDPAY) $('#copyBank').remove();
  return v;
}
// 페이앱 결제 화면에서 돌아왔을 때 (?paid=주문번호)
function showCardReturn(no){
  const list = getOrders(), v = list.find(x => x.order_no === no);
  history.replaceState(null, '', location.pathname + location.hash);
  if (!v) return;
  v.card_back = true; ls.set('gb_orders', list);
  $('#dlgBody').innerHTML = `<div class="done-box">
    <h2>주문이 접수됐어요</h2>
    <p class="subt">주문번호</p><span class="no">${esc(v.order_no)}</span>
    <div style="text-align:left">${orderBody(v)}</div>
    <p class="subt" style="font-size:13px">주문 내용은 화면 위 <b>내 주문</b>에서 다시 볼 수 있어요.</p>
    <div class="row"><button class="btn" id="ok">확인</button></div></div>`;
  $('#ok').onclick = () => $('#dlg').close();
  $('#dlg').showModal();
}
function openMyOrders(){
  $('#dlgBody').innerHTML = `<h2>내 주문</h2><p class="subt">이 기기에서 주문한 최근 5건이에요. 입금·준비 상태는 매장에 문의해 주세요.</p>
    <div class="olist">${getOrders().map(v => `<div class="oitem"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><b>${esc(v.order_no)}</b><span class="subt" style="margin:0">${esc(v.at)}</span></div>${orderBody(v)}</div>`).join('')}</div>
    <div class="row"><button class="btn" id="ok">닫기</button></div>`;
  $('#ok').onclick = () => $('#dlg').close();
  if (!$('#dlg').open) $('#dlg').showModal();
}

/* ---------- 공유 ---------- */
async function share(p){
  STATS.share(p);
  const url = location.href.split('#')[0] + '#p-' + p.id;
  const data = {title: p.regular ? p.name : `${p.name} 공동구매`, text: p.regular ? `${p.name} ${won(unitOf(p))} — ${CONFIG.BRAND}` : `${p.name} 공동구매 ${won(unitOf(p))} — 같이 모아요!`, url};
  try { if (navigator.share) return await navigator.share(data); await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
  catch(e){ if (e.name !== 'AbortError') toast(url); }
}

/* ---------- 시작 ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-add]'), s = e.target.closest('[data-share]'), cp = e.target.closest('[data-copy]');
  if (a) addToCart(findP(a.dataset.add));
  if (s) share(findP(s.dataset.share));
  if (e.target.closest('#cartOpen')) openCart();
  if (e.target.closest('#myOrders')) openMyOrders();
  if (cp) navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('주소를 복사했어요'), () => toast(cp.dataset.copy));
  const pc = e.target.closest('[data-paycard]');
  if (pc) {
    const v = getOrders().find(x => x.order_no === pc.dataset.paycard);
    if (v && v.phone && v.total) { pc.disabled = true; pc.textContent = '결제 화면으로 이동 중…'; payCard(v); }
    else toast('주문 정보를 찾지 못했어요. 전화로 문의해 주세요: ' + CONFIG.CONTACT);
  }
});
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

(async function init(){
  document.title = `${CONFIG.BRAND} 공동구매`;
  $('#brand').innerHTML = `${esc(CONFIG.BRAND)}<small>공동구매</small>`;
  $('#contact').textContent = `문의 ${CONFIG.CONTACT}`; $('#contact').href = 'tel:' + CONFIG.CONTACT.replace(/\D/g,'');
  $('#stepBank').textContent = CONFIG.BANK;
  if (CARD_ON) $('#stepPay').innerHTML = '<b>결제</b> — 카드결제 또는 계좌 입금하면 참여 완료 (목표 미달 시 전액 환불)';
  const paidNo = new URLSearchParams(location.search).get('paid');
  if (paidNo) showCardReturn(paidNo);
  if (!CONFIG.ALLOW_DELIVERY) $('#stepRecv').innerHTML = '<b>매장 픽업</b> — 준비되면 문자로 알려드려요';
  $('#footer').innerHTML = `${esc(CONFIG.BRAND)} · 문의 ${esc(CONFIG.CONTACT)}${CONFIG.ADDRESS ? ' · ' + esc(CONFIG.ADDRESS) : ''}<br>공동구매는 목표 수량 미달 시 취소될 수 있으며, 이 경우 입금액은 전액 환불됩니다.`;
  if (DEMO_MODE) $('#notice').textContent = '데모 모드입니다. CONFIG에 SheetDB 주소를 넣으면 실제 시트와 연결됩니다.';
  updateMyOrders();
  try {
    PRODUCTS = (await loadProducts()).map(normalize);
    render();
    if (cleanCart()) toast('마감된 상품이 장바구니에서 빠졌어요');
    updateCartBar();
  } catch (e) {
    $('#list').innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
})();
</script>
